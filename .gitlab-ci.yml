stages:
  - build
  - test
  - deploy

variables:
  GIT_SSL_NO_VERIFY: "true"

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t album-manager:latest .

test:
  stage: test
  image: node:20-alpine
  script:
    - cd server && npm install && npm test
    - cd ../client && npm install && npm run build

deploy:
  stage: deploy
  script:
    - echo "Desplegant a 192.168.1.55..."
    - chmod +x deploy.sh
    - ./deploy.sh
  only:
    - main
