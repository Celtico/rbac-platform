name: album-manager
services:
  app:
    build: .
    env_file:
      - path: server/.env
        required: true
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/cel/album-manager:/app/album-manager
    restart: always
