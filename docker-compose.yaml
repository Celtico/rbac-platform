services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yaml:/app/docker-compose.yaml
      - ./.git:/app/.git
      - ./Dockerfile:/app/Dockerfile
      - ./client:/app/client
      - ./server:/app/server
      - ./deploy.sh:/app/deploy.sh
    restart: always
