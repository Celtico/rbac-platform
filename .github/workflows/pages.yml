# Publica a GitHub Pages la DEMO SENSE SERVIDOR del client (VITE_DEMO=1):
# el backend, l'Odoo i el xat són simulats dins del navegador (client/src/demo).
# L'app real (NestJS + OpenAI + Odoo) es desplega amb Docker; vegeu DEPLOY.md.
name: Demo a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build de la demo
        working-directory: client
        env:
          VITE_DEMO: "1"
          # "" amb domini propi, "/rbac-platform" a celtico.github.io.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build
          # Pages no té rutes de SPA: el 404 serveix la mateixa app.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
